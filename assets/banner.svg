  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="18">
    <text x="58" y="393" fill="#777B6E">01</text><text x="100" y="393" fill="#242A23">Listen</text>
    <text x="450" y="393" fill="#777B6E">02</text><text x="492" y="393" fill="#242A23">Clarify</text>
    <text x="842" y="393" fill="#777B6E">03</text><text x="884" y="393" fill="#242A23">Confirm</text>
  </g>
</svg>
